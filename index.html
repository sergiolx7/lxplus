<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05060b">
<meta name="robots" content="noindex,nofollow">
<title>LX Plus — Manutenção</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:#fff;background:#05060b}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 75% 0,rgba(128,40,255,.18),transparent 35%),#05060b}
main{width:min(780px,100%);padding:1px;border-radius:28px;background:linear-gradient(135deg,rgba(168,85,247,.6),rgba(59,130,246,.2),rgba(255,255,255,.05));box-shadow:0 28px 90px rgba(0,0,0,.5)}
section{padding:clamp(34px,6vw,66px);border-radius:27px;background:rgba(9,11,20,.96)}
.logo{font-size:42px;font-weight:950;letter-spacing:-2px}.logo span{color:#a855f7}
.badge{display:inline-flex;gap:8px;align-items:center;margin:32px 0 14px;padding:8px 12px;border-radius:999px;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.22);color:#d8b4fe;font-size:12px;font-weight:800}
.badge i{width:8px;height:8px;border-radius:50%;background:#a855f7;box-shadow:0 0 16px #a855f7}
h1{margin:0;font-size:clamp(36px,6vw,66px);line-height:.98;letter-spacing:-2.4px}
p{max-width:610px;color:#9ea3b7;font-size:17px;line-height:1.65}
.bar{height:7px;margin-top:34px;border-radius:999px;background:#151827;overflow:hidden}.bar:after{content:"";display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#7c3aed,#a855f7,#3b82f6);animation:m 2.5s ease-in-out infinite}
small{display:block;margin-top:17px;color:#74798e}@keyframes m{0%,100%{transform:translateX(-20%)}50%{transform:translateX(180%)}}
</style>
</head>
<body>
<main><section>
<div class="logo">LX <span>Plus</span></div>
<div class="badge"><i></i> Reconstrução completa em andamento</div>
<h1>A nova LX Plus está sendo refeita do zero.</h1>
<p>Entrada, login, Home, LX Music, Comunidade, ranking, players e painel administrativo estão sendo reconstruídos. Seus dados e conteúdos continuam preservados.</p>
<div class="bar"></div>
<small>Voltamos quando a nova versão estiver pronta.</small>
</section></main>
</body>
</html>
