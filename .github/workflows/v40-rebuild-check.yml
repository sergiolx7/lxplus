name: LX Plus V42 Visual Preview

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Validate clean shell
        run: |
          node --check lxplus.v42.js
          test -s lxplus.v42.css
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          assert 'lxplus.v42.css' in h and 'lxplus.v42.js' in h
          for old in ('lxplus.bundle.css','lxplus.rebuild.css','lxplus.reference.css','lxplus.v41.css','lxplus.bundle.js','lxplus.v41.js'):
              assert old not in h, old
          print('clean V42 shell ok')
          PY
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Screenshot approved-reference surfaces
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p /tmp/v42shots
          python3 -m http.server 4173 >/tmp/v42-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          sleep 1
          cat >/tmp/v42.cjs <<'JS'
          const {chromium,firefox,webkit}=require(process.cwd()+'/node_modules/playwright');
          const assert=require('node:assert');
          const engines={chromium,firefox,webkit};
          (async()=>{
            const browser=await engines[process.env.BROWSER].launch({headless:true});
            const views=['home','music','community','admin'];
            for(const view of views){
              const ctx=await browser.newContext({viewport:{width:1672,height:941},deviceScaleFactor:1});
              const page=await ctx.newPage();
              const errs=[]; page.on('pageerror',e=>errs.push(String(e)));
              const r=await page.goto('http://127.0.0.1:4173/?preview=1&view='+view,{waitUntil:'networkidle',timeout:40000});
              assert(r&&r.ok(),view+' failed HTTP');
              await page.waitForTimeout(1200);
              assert((await page.locator('body').innerText()).length>100,view+' blank');
              assert(errs.length===0,view+' errors: '+errs.join(' | '));
              if(view==='home'){
                assert(await page.locator('.lx-hero').count()===1,'home hero missing');
                assert(await page.locator('.lx-rank').count()>=5,'top10 missing');
                assert(await page.locator('.lx-rail').count()===1,'rail missing');
              }
              if(view==='music'){
                assert(await page.locator('.lx-music-hero').count()===1,'music hero missing');
                assert(await page.locator('.lx-floating').count()===1,'floating player missing');
              }
              if(view==='community'){
                assert(await page.locator('.lx-community').count()===1,'community drawer missing');
              }
              if(view==='admin'){
                assert(await page.locator('.lx-kpi').count()===6,'admin kpis missing');
                assert(await page.locator('.lx-admin-side').count()===1,'admin side missing');
              }
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              assert(overflow<=12,view+' horizontal overflow '+overflow);
              await page.screenshot({path:'/tmp/v42shots/'+process.env.BROWSER+'-'+view+'.png',fullPage:false});
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/v42.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v42-${{ matrix.browser }}-screens
          path: /tmp/v42shots
          retention-days: 5
