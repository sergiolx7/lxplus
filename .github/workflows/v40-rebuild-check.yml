name: LX Plus V41 Full Rebuild Check

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check lxplus.bundle.js
          node --check lxplus.v40.js
          node --check lxplus.rebuild.js
          node --check lxplus.v41.js
          node --check lxplus.recovery.js
          node --check lxplus.support.js
          node --check lxplus.audiofx.js
          node --check service-worker.js

      - name: Manifest JSON
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('manifest.webmanifest',encoding='utf-8'))
          assert p['version']=='V41-FULL-REBUILD-20260925'
          assert p['start_url'].endswith('V41-FULL-REBUILD-20260925')
          print('manifest ok')
          PY

      - name: Rebuild wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          assert html.count('lxplus.v41.css')==1
          assert html.count('lxplus.v41.js')==1
          assert html.count('lxplus.bundle.js')==1
          assert html.count('lxplus.v40.js')==1
          assert html.count('lxplus.rebuild.js')==1
          assert 'lxplus.reference.css' not in html
          assert 'lxplus.reference.js' not in html
          assert 'V41-FULL-REBUILD-20260925' in html
          for x in ('lxplus.v41.css','lxplus.v41.js','lxplus.bundle.js','lxplus.v40.js','lxplus.rebuild.js'):
              assert x in sw, x
          print('v41 wiring ok')
          PY

      - name: Required files
        run: |
          test -s index.html
          test -s lxplus.bundle.css
          test -s lxplus.bundle.js
          test -s lxplus.rebuild.css
          test -s lxplus.rebuild.js
          test -s lxplus.v40.js
          test -s lxplus.v41.css
          test -s lxplus.v41.js
          test -s legacy/v40/index.html
          test -s legacy/v40/lxplus.reference.css
          test -s legacy/v40/lxplus.reference.js
          test -s assets/lxplus-logo-v27.png
          test -s supabase/migrations/20260925154634_lxplus_v40_complete.sql
          test -s supabase/migrations/20260925165208_lxplus_v40_hardening.sql

      - name: Static server smoke test
        run: |
          python3 -m http.server 4173 >/tmp/lx-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          sleep 1
          for x in index.html lxplus.bundle.css lxplus.bundle.js lxplus.rebuild.css lxplus.v40.js lxplus.rebuild.js lxplus.v41.css lxplus.v41.js service-worker.js manifest.webmanifest; do
            curl -fsS "http://127.0.0.1:4173/$x" >/dev/null
          done

  browser-smoke:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install browser runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Boot and inspect rebuilt surfaces
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p /tmp/lxshots
          python3 -m http.server 4173 >/tmp/lx-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          cat > /tmp/lx-v41-smoke.cjs <<'JS'
          const { chromium, firefox, webkit } = require(process.cwd() + '/node_modules/playwright');
          const assert = require('node:assert');
          const engines={chromium,firefox,webkit};
          const catalog=[
            {id:1,type:'Filme',title:'Insaciável',year:2026,genre:'Drama',desc:'Uma estudante de medicina mergulha em uma realidade cada vez mais sombria.',cover:'assets/lxplus-logo-v27.png',banner:'assets/lxplus-logo-v27.png',published:true,featured:true,trending:true,priority:10},
            {id:2,type:'Filme',title:'Toy Story 5',year:2026,genre:'Animação',cover:'assets/lxplus-logo-v27.png',banner:'assets/lxplus-logo-v27.png',published:true,trending:true,priority:8},
            {id:3,type:'Série',title:'Reacher',year:2026,genre:'Ação',cover:'assets/lxplus-logo-v27.png',banner:'assets/lxplus-logo-v27.png',published:true,trending:true,priority:7},
            {id:4,type:'Filme',title:'Só Por Uma Noite',year:2026,genre:'Drama',cover:'assets/lxplus-logo-v27.png',banner:'assets/lxplus-logo-v27.png',published:true,priority:6},
            {id:5,type:'Música',title:'LUNCH',artist:'Billie Eilish',album:'HIT ME HARD AND SOFT',genre:'Pop',cover:'assets/lx-music-fallback.svg',banner:'assets/lx-music-fallback.svg',published:true,featured:true,trending:true,priority:10,mediaKey:''},
            {id:6,type:'Música',title:'Starboy',artist:'The Weeknd',album:'Starboy',genre:'Pop',cover:'assets/lx-music-fallback.svg',published:true,trending:true,priority:9,mediaKey:''},
            {id:7,type:'Música',title:'SOUR',artist:'Olivia Rodrigo',album:'SOUR',genre:'Pop Rock',cover:'assets/lx-music-fallback.svg',published:true,priority:8,mediaKey:''},
            {id:8,type:'Música',title:'BRAT',artist:'Charli XCX',album:'BRAT',genre:'Dance',cover:'assets/lx-music-fallback.svg',published:true,priority:7,mediaKey:''},
            {id:9,type:'Música',title:'Currents',artist:'Tame Impala',album:'Currents',genre:'Indie',cover:'assets/lx-music-fallback.svg',published:true,priority:6,mediaKey:''},
            {id:10,type:'Música',title:'Mais Uma Vez',artist:'Jão',album:'Super',genre:'Brasil',cover:'assets/lx-music-fallback.svg',published:true,priority:5,mediaKey:''},
            {id:11,type:'Música',title:'Espresso',artist:'Sabrina Carpenter',album:'Short n Sweet',genre:'Pop',cover:'assets/lx-music-fallback.svg',published:true,priority:4,mediaKey:''}
          ];
          (async()=>{
            const browser=await engines[process.env.BROWSER].launch({headless:true});
            const viewports=[
              {name:'desktop',width:1440,height:900},
              {name:'tablet',width:820,height:1180},
              {name:'mobile',width:390,height:844}
            ];
            for(const vp of viewports){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
              const page=await context.newPage();
              const fatal=[];
              page.on('pageerror',e=>fatal.push(String(e)));
              const response=await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded',timeout:30000});
              assert(response && response.ok(),vp.name+' HTTP boot failed');
              await page.waitForTimeout(3500);
              const auth=await page.locator('#auth').isVisible();
              assert(auth,vp.name+' auth not visible');
              assert(!(await page.locator('#admin').isVisible()),vp.name+' admin leaked over auth');
              assert(await page.locator('#loginForm').count()===1,vp.name+' login form missing');
              if(vp.name==='desktop') await page.screenshot({path:'/tmp/lxshots/'+process.env.BROWSER+'-auth.png',fullPage:true});

              await page.evaluate((catalog)=>{
                LX.data.catalog=()=>catalog;
                LX.data.history=()=>({1:{progress:43,opened:Date.now()},2:{progress:22,opened:Date.now()-1000}});
                LX.data.users=()=>[
                  {id:'1',name:'Lucas Silva',visible:true,watched:80,listened:10,read:2},
                  {id:'2',name:'Mariana FPS',visible:true,watched:55,listened:18,read:1},
                  {id:'3',name:'Ghostzera',visible:true,watched:44,listened:9,read:1}
                ];
                LX.data.analytics=()=>[{event:'play',at:Date.now(),data:{title:'Insaciável'}}];
                LX.data.requests=()=>[];
                LX.data.ratings=()=>({});
                LX.data.preferences=()=>({});
                LX.data.recommendation=(a)=>a;
                LX.ui.state.user={id:'test',name:'Sergio',email:'test@example.com',admin:true,approved:true};
                LX.ui.state.profile=LX.ui.state.user;
                LX.ui.state.screen='app';
                LX.ui.state.mode='Assistir';
                LX.ui.state.category='Início';
                LX.ui.state.query='';
                LX.ui.show('app');
                LX.ui.renderApp();
              },catalog);
              await page.waitForTimeout(500);
              assert(await page.locator('.lx41-home').count()===1,vp.name+' rebuilt home missing');
              assert(await page.locator('.lx41-hero').count()===1,vp.name+' rebuilt hero missing');
              assert(await page.locator('.lx41-top10-card').count()>=4,vp.name+' Top 10 missing');
              assert(await page.locator('#lxDesktopRail').isVisible()=== (vp.name==='desktop'),vp.name+' desktop rail visibility wrong');
              assert(await page.locator('#lx40Top10,#lx40Pulse,#lx40Premiere').count()===0,vp.name+' legacy v40 home block leaked');
              const homeLayout=await page.evaluate(()=>({
                first:document.querySelector('.lx41-home')?.firstElementChild?.className||'',
                rail:document.querySelector('#lxDesktopRail')?.getBoundingClientRect().width||0,
                art:document.querySelector('.lx41-card-art')?.getBoundingClientRect().height||0
              }));
              assert(String(homeLayout.first).includes('lx41-hero'),vp.name+' hero is not first home block');
              if(vp.name==='desktop') assert(homeLayout.rail>60&&homeLayout.rail<110,'desktop rail width wrong: '+homeLayout.rail);
              assert(homeLayout.art>60,vp.name+' content card artwork collapsed: '+homeLayout.art);
              if(vp.name==='desktop') await page.screenshot({path:'/tmp/lxshots/'+process.env.BROWSER+'-home.png',fullPage:true});

              await page.evaluate(()=>{LX.ui.state.mode='Ouvir';LX.ui.state.category='Início';LX.ui.state.musicView='home';LX.ui.renderApp()});
              await page.waitForTimeout(500);
              assert(await page.locator('.lx41-music-shell').count()===1,vp.name+' rebuilt music shell missing');
              assert(await page.locator('.lx41-music-card').count()>=6,vp.name+' music rows too sparse');
              const musicLayout=await page.evaluate(()=>{const r=document.querySelector('.lx41-music-shell')?.getBoundingClientRect();return r?{top:r.top,height:r.height}:null});
              assert(musicLayout&&musicLayout.top<120,vp.name+' music shell starts too low: '+JSON.stringify(musicLayout));
              if(vp.name==='desktop') await page.screenshot({path:'/tmp/lxshots/'+process.env.BROWSER+'-music.png',fullPage:true});

              await page.evaluate(()=>{LX.ui.state.screen='admin';LX.ui.show('admin');LX.admin.render('dashboard')});
              await page.waitForTimeout(500);
              assert(await page.locator('.lx41-admin-hero').count()===1,vp.name+' rebuilt admin missing');
              assert(await page.locator('.lx41-kpi').count()===6,vp.name+' admin KPIs missing');
              assert(await page.locator('.lx-mass-launch:not(.lx41-mass-sentinel)').count()===0,vp.name+' legacy mass import banner leaked');
              const adminLayout=await page.evaluate(()=>{const r=document.querySelector('#adminMain')?.getBoundingClientRect();return r?{x:r.x,width:r.width}:null});
              if(vp.name==='desktop'){assert(adminLayout&&adminLayout.x>150,'admin main overlaps sidebar');assert(adminLayout.width>900,'admin main too narrow: '+(adminLayout&&adminLayout.width));}
              if(vp.name==='desktop') await page.screenshot({path:'/tmp/lxshots/'+process.env.BROWSER+'-admin.png',fullPage:true});

              await page.evaluate(()=>{LX.ui.state.screen='app';LX.ui.show('app');LX.social?.open?.('friends')});
              await page.waitForTimeout(400);
              const community=page.locator('#lxCommunityDrawer,.lx-community-drawer').first();
              assert(await community.count()===1,vp.name+' community drawer missing');
              assert(await community.isVisible(),vp.name+' community drawer not visible');
              if(vp.name==='desktop') await page.screenshot({path:'/tmp/lxshots/'+process.env.BROWSER+'-community.png',fullPage:true});

              const metrics=await page.evaluate(()=>({width:document.documentElement.scrollWidth,client:document.documentElement.clientWidth,build:document.documentElement.dataset.lxBuild||''}));
              assert(metrics.build==='V41-FULL-REBUILD-20260925',vp.name+' build marker missing');
              assert(metrics.width<=metrics.client+14,vp.name+' horizontal overflow '+metrics.width+'/'+metrics.client);
              assert(fatal.length===0,vp.name+' page errors: '+fatal.join(' | '));
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/lx-v41-smoke.cjs

      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lx-v41-${{ matrix.browser }}-screens
          path: /tmp/lxshots
          if-no-files-found: ignore
          retention-days: 3
