name: LX Plus V43 Reference Fidelity QA

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - name: Validate V43 shell
        run: |
          node --check lxplus.v43.fidelity.js
          test -s lxplus.v43.fidelity.css
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          assert 'lxplus.v43.fidelity.css' in h
          assert 'lxplus.v43.fidelity.js' in h
          assert 'V43-REFERENCE-FIDELITY-20260926' in h
          for old in ('lxplus.bundle.css','lxplus.rebuild.css','lxplus.reference.css','lxplus.v41.css','lxplus.v42.css','lxplus.bundle.js','lxplus.v41.js','lxplus.v42.js'):
              assert old not in h, old
          print('V43 clean shell ok')
          PY

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run reference fidelity and responsive QA
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p /tmp/v43shots
          python3 -m http.server 4173 >/tmp/v43-http.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          sleep 1
          cat >/tmp/v43-qa.cjs <<'JS'
          const {chromium,firefox,webkit}=require(process.cwd()+'/node_modules/playwright');
          const assert=require('node:assert');
          const engines={chromium,firefox,webkit};
          const sizes=[
            {name:'desktop',width:1672,height:941},
            {name:'laptop',width:1366,height:768},
            {name:'tablet',width:820,height:1180},
            {name:'mobile',width:390,height:844}
          ];
          const base='http://127.0.0.1:4173/';
          const noOverflow=async(page,label)=>{const m=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));assert(m.sw-m.cw<=12,label+' overflow '+JSON.stringify(m));};
          const visible=async(page,sel,label)=>assert(await page.locator(sel).first().isVisible(),label+' hidden');
          (async()=>{
            const browser=await engines[process.env.BROWSER].launch({headless:true});
            for(const vp of sizes){
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height},deviceScaleFactor:1});
              const page=await ctx.newPage();
              const errs=[];page.on('pageerror',e=>errs.push(String(e)));
              let r=await page.goto(base+'?preview=1&view=home',{waitUntil:'networkidle',timeout:40000});
              assert(r&&r.ok(),vp.name+' home HTTP');
              await page.waitForTimeout(350);
              await visible(page,'.lx43-hero',vp.name+' hero');
              await visible(page,'.lx43-orbit',vp.name+' luminous orbit');
              await visible(page,'.lx43-planet',vp.name+' cosmic planet');
              await visible(page,'.lx43-water',vp.name+' reflective glow');
              assert(await page.locator('.lx43-modebar button').count()===6,vp.name+' experience mode count');
              assert(await page.locator('.lx43-card').count()>=12,vp.name+' home catalog incomplete');
              if(vp.width>1080){await visible(page,'.lx43-left',vp.name+' left sidebar');await visible(page,'.lx43-right',vp.name+' right sidebar');}
              if(vp.width<=820)await visible(page,'.lx43-mobile-dock',vp.name+' mobile dock');
              await noOverflow(page,vp.name+' home');
              await page.screenshot({path:`/tmp/v43shots/${process.env.BROWSER}-${vp.name}-home.png`,fullPage:false});

              // easy-function navigation surfaces
              for(const view of ['films','series','books','live','music','community','ai','ranking','premium','admin']){
                await page.goto(base+'?preview=1&view='+view,{waitUntil:'domcontentloaded',timeout:40000});
                await page.waitForTimeout(120);
                assert((await page.locator('.lx43-main').innerText()).length>60,vp.name+' '+view+' blank');
                await noOverflow(page,vp.name+' '+view);
              }
              // functional list persistence
              await page.goto(base+'?preview=1&view=films',{waitUntil:'domcontentloaded'});await page.waitForTimeout(120);
              const add=page.locator('[data-list]').first();if(await add.count()){await add.click();await page.goto(base+'?preview=1&view=list',{waitUntil:'domcontentloaded'});await page.waitForTimeout(100);assert(await page.locator('.lx43-card').count()>=1,vp.name+' list persistence failed');}
              // community send interaction
              await page.goto(base+'?preview=1&view=community',{waitUntil:'domcontentloaded'});await page.waitForTimeout(100);
              await page.locator('#lx43Message').fill('QA V43');await page.locator('#lx43Compose').evaluate(f=>f.requestSubmit());await page.waitForTimeout(50);assert((await page.locator('#lx43NewMessages').innerText()).includes('QA V43'),vp.name+' chat send failed');
              // AI visible response
              await page.goto(base+'?preview=1&view=ai',{waitUntil:'domcontentloaded'});await page.waitForTimeout(100);await page.locator('[data-ai]').first().click();assert(await page.locator('#lx43AiAnswer').isVisible(),vp.name+' AI answer hidden');
              assert(errs.length===0,vp.name+' page errors: '+errs.join(' | '));
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/v43-qa.cjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v43-${{ matrix.browser }}-reference-screens
          path: /tmp/v43shots
          if-no-files-found: ignore
          retention-days: 5
