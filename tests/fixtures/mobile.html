<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>LX Plus — QA responsivo</title><style>body{margin:0;background:#24212b;color:#d2c2e5;font:13px sans-serif;display:grid;justify-items:center}header{padding:15px;text-align:center}nav{display:flex;gap:8px;margin-bottom:12px}button{border:1px solid #705584;border-radius:8px;padding:8px 12px;background:#17131e;color:#e3d7ee}button[aria-pressed=true]{background:#76598b}iframe{width:390px;height:844px;border:1px solid #705584;background:#090a0e;border-radius:20px}p{max-width:600px;line-height:1.6;color:#c5b2d9;font-size:11px}</style></head><body><header>QA local · layouts responsivos</header><nav aria-label="Largura do teste"><button data-width="360" aria-pressed="false">360 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="768" aria-pressed="false">768 px</button><button data-width="1024" aria-pressed="false">1024 px</button></nav><iframe title="LX Plus mobile QA" src="../../qa/"></iframe><p>Dados fictícios. Este teste de layout em navegador desktop não substitui testes em iPhone ou Android físicos.</p><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('iframe').style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));</script></body></html>
