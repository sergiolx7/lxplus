<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LX Plus — validação técnica de mídia</title><style>body{background:#111018;color:#eee;font:16px system-ui;max-width:1050px;padding:30px;margin:auto}button,select{padding:12px;background:#ac8ae4;color:#100b18;border:0;border-radius:8px;margin:8px}section{padding:20px;border:1px solid #564269;border-radius:14px;margin:18px 0}video{width:100%;max-height:300px;background:#000}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#c4acd7}.ok{color:#95ddbc}.failed{color:#ffb0b9}</style><h1>Validação técnica LX Plus</h1><p>Executa os módulos reais de reprodução e sinalização. As fontes são vídeos de teste externos; nenhuma conta, catálogo ou conversa é alterada.</p><p><strong>Este teste local não valida login nem substitui chamada entre dois aparelhos.</strong></p><button id="run">Executar MP4, HLS, DASH e WebRTC local</button><button id="mse">Testar fallback HLS por MSE</button><button id="rtc">Repetir WebRTC com diagnóstico</button><div id="tests"></div><pre id="result" aria-live="polite">Aguardando execução.</pre><script type="module">
import {attachPlayer} from '../../src/universal-player.js';
import {Calls} from '../../src/calls.js';
const result=document.querySelector('#result'),area=document.querySelector('#tests'),records=[];
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const deadline=(promise,ms)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(Error('Tempo limite do teste.')),ms))]);
function report(){result.textContent=JSON.stringify(records,null,2)}
async function mediaTest(label,kind,url,forceMse=false){
 const section=document.createElement('section');section.innerHTML='<h2>'+label+'</h2><p role="status">Preparando…</p><video controls muted playsinline></video><select aria-label="Qualidade '+label+'"><option value="-1">Automática</option></select>';area.append(section);
 const video=section.querySelector('video'),status=section.querySelector('p'),select=section.querySelector('select');video.muted=true;if(forceMse){const nativeCanPlay=video.canPlayType.bind(video);video.canPlayType=type=>/mpegurl/i.test(type)?'':nativeCanPlay(type)}let cleanup,error=null,qualities=[],choose=null;
 const record={test:label,status:'running',source:url};records.push(record);report();
 try{
  cleanup=await attachPlayer(video,{kind,url},{onError:message=>error=message,onQualities:(options,set)=>{qualities=options;choose=set;select.innerHTML='<option value="-1">Automática</option>'+options.map(o=>'<option value="'+o.id+'">'+o.label+'</option>').join('');select.onchange=()=>set(Number(select.value));if(options.length){select.value=String(options.at(-1).id);set(options.at(-1).id)}}});
  const until=Date.now()+20000;while(video.currentTime<2&&!error&&Date.now()<until)await pause(250);if(error)throw Error(error);if(video.currentTime<2)throw Error('A reprodução não avançou.');
  record.duration=video.duration;record.qualities=qualities.map(q=>q.label);record.manualQuality=qualities.length?qualities.at(-1).label:null;
  video.playbackRate=1.5;const target=Math.min(20,video.duration/3);video.currentTime=target;await video.play();const seekUntil=Date.now()+12000;while((video.seeking||video.currentTime<target+1)&&!error&&Date.now()<seekUntil)await pause(250);if(error)throw Error(error);if(video.currentTime<target+1)throw Error('A reprodução não retomou depois da busca.');
  record.position=Number(video.currentTime.toFixed(2));record.speed=video.playbackRate;record.readyState=video.readyState;record.videoWidth=video.videoWidth;record.decodedFrames=video.getVideoPlaybackQuality?.().totalVideoFrames||0;if(!record.videoWidth||!record.decodedFrames)throw Error('O navegador não confirmou quadros de vídeo decodificados.');record.status='pass';status.className='ok';status.textContent='PASSOU: reprodução real, busca e velocidade; '+qualities.length+' qualidades disponíveis.';
 }catch(e){record.status='fail';record.error=e.message;status.className='failed';status.textContent='FALHOU: '+e.message}
 finally{cleanup?.();video.hidden=true;select.disabled=true;report()}
}
async function rtcTest(){
 const section=document.createElement('section');section.innerHTML='<h2>WebRTC local — sinalização e canal de dados</h2><p role="status">Preparando…</p><small>Dois peers neste navegador, sem câmera/microfone, sem contas nem sinais no Supabase. Não verifica TURN ou uma chamada real.</small>';area.append(section);const status=section.querySelector('p');
 const record={test:'WebRTC local com Calls.receive',status:'running'};records.push(record);report();let id=0;
 const a=Object.assign(Object.create(Calls.prototype),{pc:new RTCPeerConnection({iceServers:[{urls:['stun:stun.cloudflare.com:3478','stun:stun.l.google.com:19302']}]}),seen:new Set(),ice:[]}),b=Object.assign(Object.create(Calls.prototype),{pc:new RTCPeerConnection({iceServers:[{urls:['stun:stun.cloudflare.com:3478','stun:stun.l.google.com:19302']}]}),seen:new Set(),ice:[]});
 const forward=(peer,kind,payload)=>{const signal={id:++id,kind,payload};queueMicrotask(()=>peer.receive(signal).catch(e=>{record.signalError=e.message}));return Promise.resolve()};a.signal=(kind,payload)=>forward(b,kind,payload);b.signal=(kind,payload)=>forward(a,kind,payload);
 record.candidatesA=0;record.candidatesB=0;a.pc.onicecandidate=e=>{if(e.candidate)record.candidatesA++;if(e.candidate)a.signal('ice',e.candidate.toJSON())};b.pc.onicecandidate=e=>{if(e.candidate)record.candidatesB++;if(e.candidate)b.signal('ice',e.candidate.toJSON())};
 try{
  const channel=a.pc.createDataChannel('qa');const exchange=new Promise(resolve=>{b.pc.ondatachannel=e=>{e.channel.onmessage=event=>{if(event.data==='ping')e.channel.send('pong')}};channel.onopen=()=>channel.send('ping');channel.onmessage=e=>{if(e.data==='pong')resolve(true)}});
  await a.pc.setLocalDescription(await a.pc.createOffer());await b.receive({id:++id,kind:'offer',payload:{type:a.pc.localDescription.type,sdp:a.pc.localDescription.sdp}});await deadline(exchange,12000);
  if(record.signalError)throw Error(record.signalError);record.status='pass';record.caller=a.pc.connectionState;record.callee=b.pc.connectionState;record.exchange='ping/pong';status.className='ok';status.textContent='PASSOU: oferta, resposta, ICE e mensagem de retorno entre peers locais.';
 }catch(e){record.status='fail';record.error=e.message;status.className='failed';status.textContent='FALHOU: '+e.message}
 finally{record.states={caller:a.pc.connectionState,callee:b.pc.connectionState,callerIce:a.pc.iceConnectionState,calleeIce:b.pc.iceConnectionState,callerSignaling:a.pc.signalingState,calleeSignaling:b.pc.signalingState,callerGathering:a.pc.iceGatheringState,calleeGathering:b.pc.iceGatheringState,queuedIceA:a.ice.length,queuedIceB:b.ice.length};a.pc.close();b.pc.close();a.pc=null;b.pc=null;report()}
}
document.querySelector('#mse').onclick=async event=>{event.target.disabled=true;await mediaTest('HLS por MSE (fallback hls.js)','hls','https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',true)};document.querySelector('#rtc').onclick=async event=>{event.target.disabled=true;await rtcTest()};
document.querySelector('#run').onclick=async event=>{event.target.disabled=true;for(const source of [['MP4','video','https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4'],['HLS','hls','https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'],['DASH','dash','https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd']])await mediaTest(...source);await rtcTest();event.target.textContent='Validação encerrada';report()};
</script></html>
