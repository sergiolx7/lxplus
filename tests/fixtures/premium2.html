<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../assets/styles.css"><title>LX Plus · QA local Premium 2</title>
<body style="padding:24px"><h1>QA LOCAL · LIVROS E PLAYER</h1><p>Arquivos sintéticos e vídeo CC0. Nenhuma conexão com dados reais.</p><div class="actions"><button class="btn" id="pdf">Abrir PDF local</button><button class="btn" id="epub">Abrir EPUB local</button><button class="btn" id="closeReader">Fechar leitor</button><button class="btn" id="video">Abrir vídeo local</button><button class="btn" id="closeVideo">Fechar vídeo</button><button class="btn" id="lifecycle">Testar limpeza</button></div><div id="reader"></div><div id="videoHost"></div><pre id="evidence"></pre>
<script type="module">
import {openReader} from '../../src/book-reader.js';
import {bindVideoSession,videoControls} from '../../src/video-session.js';
import {attachPlayer} from '../../src/universal-player.js';
const evidence={notes:[],progress:[],preferences:[],next:0};let closeReader,closeVideo;const states={};
const print=()=>document.querySelector('#evidence').textContent=JSON.stringify(evidence);
for(const format of ['pdf','epub'])document.getElementById(format).onclick=async()=>{closeReader?.();const url=URL.createObjectURL(await(await fetch('./reader-test.'+format)).blob());closeReader=await openReader(document.querySelector('#reader'),{url,format,state:states[format]||{},onSave:state=>{states[format]=state;evidence.notes.push(state);print()}});URL.revokeObjectURL(url)};
document.querySelector('#closeReader').onclick=()=>{closeReader?.();document.querySelector('#reader').replaceChildren()};
document.querySelector('#video').onclick=async()=>{closeVideo?.();const url=URL.createObjectURL(await(await fetch('./flower.mp4')).blob()),host=document.querySelector('#videoHost');host.innerHTML='<video id="testVideo" controls playsinline style="width:500px;max-width:100%"></video>'+videoControls()+'<div id="playerStatus"></div>';closeVideo=bindVideoSession(host.querySelector('video'),{kind:'video',url,revokeOnCleanup:true},{host,index:0,progress:{position:1.1,episodeIndex:0},hasNext:true,preferences:{volume:.4,speed:1.5},onNext:()=>{evidence.next++;print()},onError:message=>{host.querySelector('#playerStatus').textContent=message},saveProgress:p=>{evidence.progress.push(p);print()},savePreferences:p=>{evidence.preferences.push(p);print()}})};
document.querySelector('#closeVideo').onclick=()=>{closeVideo?.();document.querySelector('#videoHost').replaceChildren()};
document.querySelector('#lifecycle').onclick=async()=>{const el=document.createElement('audio');let errors=0,url=URL.createObjectURL(await(await fetch('./tone.wav')).blob());const stop=await attachPlayer(el,{kind:'audio',url},{onError:()=>errors++});stop();const last=await attachPlayer(el,{kind:'audio',url},{onError:()=>errors++});el.dispatchEvent(new Event('error'));last();URL.revokeObjectURL(url);evidence.lifecycleErrors=errors;print()};
</script></body></html>
