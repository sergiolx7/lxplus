<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>LX Plus — laboratório de dois participantes</title><style>body{margin:0;background:#18141e;color:#eee6fc;font:12px sans-serif}header{padding:13px;display:flex;gap:15px;align-items:center;justify-content:center;flex-wrap:wrap}button{background:#b8a2ff;color:#121018;border:0;border-radius:8px;padding:9px 14px}.frames{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}iframe{width:100%;height:820px;border:1px solid #6d5685;border-radius:14px;background:#0a0c10;box-sizing:border-box}@media(max-width:850px){.frames{grid-template-columns:1fr}}</style></head><body><header><b>QA LOCAL · 2 participantes fictícios</b><span>Sem banco, câmera ou microfone reais.</span><button id="synthetic">Ativar áudio sintético de teste</button><span id="state"></span><button id="diagnostic">Ver diagnóstico local</button></header><div class="frames"><iframe title="Participante A — proprietário" id="host"></iframe><iframe title="Participante B — amigo" id="guest"></iframe></div><pre id="diagnostic-output"></pre><script>const id=crypto.randomUUID?.()||('qa-'+Date.now()+'-'+Math.random().toString(16).slice(2));for(const peer of ['host','guest'])document.getElementById(peer).src='../../qa/?qa-peer='+peer+'&qa-case='+id;document.getElementById('diagnostic').onclick=()=>{document.getElementById('diagnostic-output').textContent=JSON.stringify(Object.fromEntries(['lx_calls','lx_call_signals','lx_watch_signals'].map(table=>{const rows=JSON.parse(localStorage.getItem('lx-qa-'+id+':'+table)||'[]');return [table,rows.map(({id,sender_id,kind,status})=>({id,sender_id,kind,status}))]})),null,2)};document.getElementById('synthetic').onclick=()=>{for(const frame of document.querySelectorAll('iframe'))frame.contentWindow.postMessage({type:'lx-enable-synthetic-audio'},location.origin);document.getElementById('state').textContent='Áudio sintético habilitado nos dois participantes.';};</script></body></html>
