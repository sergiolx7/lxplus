<!doctype html><meta charset="utf-8"><title>QA v25.41</title><style>body{font:14px system-ui;background:#07101a;color:#eaf2ff;padding:24px}li{margin:8px 0}.ok{color:#5ee29c}.bad{color:#ff6f83}</style><h1>LX Plus v25.41 QA</h1><ol id="out"></ol><script>
const out=document.getElementById('out');const results=[];function log(name,ok,detail=''){results.push({name,ok,detail});const li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=`${ok?'PASS':'FAIL'} · ${name}${detail?' · '+detail:''}`;out.appendChild(li)};const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function canvasTrack(color){const c=document.createElement('canvas');c.width=96;c.height=54;const x=c.getContext('2d');x.fillStyle=color;x.fillRect(0,0,c.width,c.height);const s=c.captureStream(12);return {track:s.getVideoTracks()[0],canvas:c,stream:s}}
function tone(freq){const ctx=new AudioContext();const osc=ctx.createOscillator();const gain=ctx.createGain();gain.gain.value=.14;const dest=ctx.createMediaStreamDestination();osc.frequency.value=freq;osc.connect(gain).connect(dest);osc.start();return {ctx,osc,track:dest.stream.getAudioTracks()[0]}}
async function negotiate(label){const A=new RTCPeerConnection(),B=new RTCPeerConnection(),va=canvasTrack('#145bff'),vb=canvasTrack('#ff416d'),aa=tone(330),ab=tone(440);const aAud=A.addTransceiver(aa.track,{direction:'sendrecv',streams:[new MediaStream([aa.track])]});const aVid=A.addTransceiver(va.track,{direction:'sendrecv',streams:[va.stream]});const offer=await A.createOffer();await A.setLocalDescription(offer);await B.setRemoteDescription(A.localDescription);const bt=B.getTransceivers(),ba=bt.find(t=>t.receiver.track.kind==='audio'),bv=bt.find(t=>t.receiver.track.kind==='video');ba.direction='sendrecv';bv.direction='sendrecv';await ba.sender.replaceTrack(ab.track);await bv.sender.replaceTrack(vb.track);const ans=await B.createAnswer();await B.setLocalDescription(ans);await A.setRemoteDescription(B.localDescription);const dirs=[...offer.sdp.matchAll(/a=(sendrecv|sendonly|recvonly|inactive)/g)].map(x=>x[1]),adirs=[...ans.sdp.matchAll(/a=(sendrecv|sendonly|recvonly|inactive)/g)].map(x=>x[1]);const sdpOk=dirs.filter(x=>x==='sendrecv').length>=2&&adirs.filter(x=>x==='sendrecv').length>=2;log(`mesh negotiation ${label}`,sdpOk,`offer ${dirs.join(',')} · answer ${adirs.join(',')}`);return {A,B,aAud,aVid,aa,ab,va,vb}}
async function localRms(track){const ctx=new AudioContext();await ctx.resume().catch(()=>{});const src=ctx.createMediaStreamSource(new MediaStream([track]));const an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);const data=new Float32Array(an.fftSize);await sleep(350);an.getFloatTimeDomainData(data);let s=0;for(const v of data)s+=v*v;const rms=Math.sqrt(s/data.length);await ctx.close();return rms}
(async()=>{try{
 const ab=await negotiate('A↔B'),ac=await negotiate('A↔C'),bc=await negotiate('B↔C');log('3-person mesh topology prepared',true,'3 peer links / 6 RTCPeerConnections');
 const mic=tone(420),screen=tone(920),mixCtx=new AudioContext(),dest=mixCtx.createMediaStreamDestination();mixCtx.createMediaStreamSource(new MediaStream([mic.track])).connect(dest);mixCtx.createMediaStreamSource(new MediaStream([screen.track])).connect(dest);const mixed=dest.stream.getAudioTracks()[0];const rms=await localRms(mixed);log('microphone + shared-screen audio mixer is live',mixed?.readyState==='live'&&rms>.003,`RMS ${rms.toFixed(4)}`);await ab.aAud.sender.replaceTrack(mixed);log('mixed screen audio can replace outgoing call audio',ab.aAud.sender.track===mixed,ab.aAud.sender.track?.readyState||'none');
 const blue=canvasTrack('#008cff');await ab.aVid.sender.replaceTrack(blue.track);log('screen video track can replace camera sender',ab.aVid.sender.track===blue.track,ab.aVid.sender.track?.readyState||'none');
 for(const q of [ab,ac,bc]){q.A.close();q.B.close();for(const o of [q.aa,q.ab]){o.osc.stop();o.ctx.close()}for(const o of [q.va,q.vb])o.track.stop()}mic.osc.stop();screen.osc.stop();mic.ctx.close();screen.ctx.close();mixCtx.close();blue.track.stop();
 window.QA_RESULTS=results;document.body.dataset.done='1';
}catch(e){console.error(e);log('QA runtime',false,String(e));window.QA_RESULTS=results;document.body.dataset.done='1'}})();
</script>
