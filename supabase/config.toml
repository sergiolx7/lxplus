project_id = "lxplus-universal-staging"

# Local/isolated staging settings only. This file does not reconfigure production.
[auth]
minimum_password_length = 12
password_requirements = "letters_digits"

[auth.email]
enable_confirmations = true
secure_password_change = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.lx-universal-catalog]
verify_jwt = true
