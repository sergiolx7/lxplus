<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">LX Plus</title>
  <desc id="desc">Marca oficial LX Plus em branco com detalhes violeta e azul.</desc>
  <defs>
    <linearGradient id="panel" x1="52" y1="44" x2="260" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171D2C"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="edge" x1="66" y1="54" x2="250" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B998FF"/>
      <stop offset=".48" stop-color="#8457FF"/>
      <stop offset="1" stop-color="#49B9FF"/>
    </linearGradient>
    <linearGradient id="letters" x1="318" y1="88" x2="850" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#F6F7FB"/>
      <stop offset="1" stop-color="#C8D1DE"/>
    </linearGradient>
    <linearGradient id="accent" x1="860" y1="92" x2="1034" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B88CFF"/>
      <stop offset=".52" stop-color="#8A4FFF"/>
      <stop offset="1" stop-color="#54C6FF"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity=".34"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="52" y="50" width="220" height="220" rx="66" fill="url(#panel)" stroke="url(#edge)" stroke-width="4"/>
    <path d="M94 101v116h66" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m166 103 65 114m0-114-65 114" fill="none" stroke="url(#edge)" stroke-width="25" stroke-linecap="round"/>
    <circle cx="238" cy="84" r="7" fill="#FFFFFF" filter="url(#glow)"/>

    <text x="315" y="220" fill="url(#letters)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="170" font-weight="850" letter-spacing="-11">LX</text>
    <text x="548" y="217" fill="#F4F6FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="116" font-weight="520" letter-spacing="-6">Plus</text>
    <g transform="translate(911 96)" filter="url(#glow)">
      <rect x="44" y="0" width="18" height="106" rx="9" fill="url(#accent)"/>
      <rect x="0" y="44" width="106" height="18" rx="9" fill="url(#accent)"/>
    </g>
  </g>
</svg>
